<!DOCTYPE html>
<html lang="pt-BR">
    <head>
    <meta charset="UTF-8">
</head>

</head>

<body>
   <header>
        <input id="repass" type="image" src="ticket_vermelho_hd.png" alt="Logo RePass" width="50" height="45" href="index.html">
        <h1 id="titulo">RePass</h1>
        <p id="descTitulo">Perdeu? Achou. Sobrou? Vendeu.</p>
    </header>

    <h2 class="cadastro"> Cadastro de Contratação - Pacote 1</h2>

<main>
    <form id="form-cadastro">
        <div class="campo">
            <label for="nome-empresa"> Nome da Empresa:</label>
            <input type-="text" id="nome-empresa" placeholder="Digite o nome da sua empresa">
        </div>

    <p class="paragrafo-espaço"></p>

        <div class="campo">
            <label for="email-empresa"> Email de Contato:</label>
            <input type="email" id="email-empresa" placeholder="seu@email.com">
        </div>

    <p class="paragrafo-espaço"></p>

        <div class="campo">
            <label for="tipo-evento"> Qual seu tipo de evento:</label>
            <input type="text" id="tipo-evento" placeholder="Digite o tipo do seu evento">
        </div>

    <p class="paragrafo-espaço"></p>

         <div class="campo">
            <label for="observacoes">Informações do Anúncio:</label>
            <textarea id="observacoes" rows="5" placeholder="Escreva aqui os detalhes do seu anúncio"></textarea>
        </div>

    <p class="paragrafo-espaço"></p>

        <div class="campo">
            <label for="preco"> Preço do ingresso para revenda:</label>
            <input type="number" id="preco-ingresso" placeholder="Digite o preço do seu ingresso">
        </div>

    <p class="paragrafo-espaço"></p>

        <div class="campo">
            <label id="escolha">Forma de pagamento para taxa:</label>
            <select class="opcoes" id="opcoes">
                 <option value="valor1">Pix</option>
                 <option value="valor2">Cartão - Débito </option>
                 <option value="valor3">Cartão - Crédito </option>
            </select>
         </div>
    </form>

      <p class="paragrafo-espaço"></p>

    <div class="enviar">
     <button>Finalizar Cadastro</button>
     </div>
</main>


    <footer>
        <p>&copy; 2026 RePass. Todos os direitos reservados.</p>
    </footer>
</body>
<link rel="stylesheet" href="rent1.css">
</html>
